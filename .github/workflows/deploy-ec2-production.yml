name: Deploy to EC2 Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or commit SHA)
        required: false
        default: main
        type: string
      image_tag:
        description: Docker image tag to publish. Defaults to deploy-<short-sha>.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          submodules: true

      - name: Validate required configuration
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OSS_JWT_SECRET: ${{ secrets.OSS_JWT_SECRET }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          missing=""
          for name in EC2_HOST EC2_USER DEPLOY_PATH SSH_PRIVATE_KEY REDIS_URL OSS_JWT_SECRET DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "Missing required GitHub Environment vars/secrets:$missing"
            exit 1
          fi

      - name: Compute image tag
        id: image
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          image_tag="${INPUT_IMAGE_TAG:-}"

          if [ -z "$image_tag" ]; then
            image_tag="deploy-${short_sha}"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push deployment images
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          registry="${REGISTRY:-$DOCKERHUB_USERNAME}"

          docker buildx build \
            --platform linux/amd64 \
            -f api/Dockerfile \
            -t "$registry/dograh-api:$IMAGE_TAG" \
            --push \
            .

          docker buildx build \
            --platform linux/amd64 \
            -f ui/Dockerfile \
            -t "$registry/dograh-ui:$IMAGE_TAG" \
            --push \
            .

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_PRIVATE_KEY }}' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Trust EC2 host key
        run: |
          set -euo pipefail
          ssh-keyscan -H '${{ vars.EC2_HOST }}' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy stack on EC2
        env:
          DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OSS_JWT_SECRET: ${{ secrets.OSS_JWT_SECRET }}
          REGISTRY: ${{ vars.REGISTRY }}
          BACKEND_API_ENDPOINT: ${{ vars.BACKEND_API_ENDPOINT }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          MINIO_PUBLIC_ENDPOINT: ${{ vars.MINIO_PUBLIC_ENDPOINT }}
          TURN_HOST: ${{ vars.TURN_HOST }}
          TURN_SECRET: ${{ secrets.TURN_SECRET }}
          FORCE_TURN_RELAY: ${{ vars.FORCE_TURN_RELAY }}
          ENABLE_TELEMETRY: ${{ vars.ENABLE_TELEMETRY }}
          FASTAPI_WORKERS: ${{ vars.FASTAPI_WORKERS }}
        run: |
          set -euo pipefail

          ssh "$EC2_USER@$EC2_HOST" \
            "set -euo pipefail; \
            cd '$DEPLOY_PATH'; \
            git fetch --all --tags; \
            git checkout '$DEPLOY_REF'; \
            git pull --ff-only origin '$DEPLOY_REF'; \
            REDIS_URL='$REDIS_URL' \
            OSS_JWT_SECRET='$OSS_JWT_SECRET' \
            IMAGE_TAG='$IMAGE_TAG' \
            REGISTRY='${REGISTRY:-}' \
            BACKEND_API_ENDPOINT='${BACKEND_API_ENDPOINT:-}' \
            BACKEND_URL='${BACKEND_URL:-}' \
            MINIO_PUBLIC_ENDPOINT='${MINIO_PUBLIC_ENDPOINT:-}' \
            TURN_HOST='${TURN_HOST:-}' \
            TURN_SECRET='${TURN_SECRET:-}' \
            FORCE_TURN_RELAY='${FORCE_TURN_RELAY:-}' \
            ENABLE_TELEMETRY='${ENABLE_TELEMETRY:-}' \
            FASTAPI_WORKERS='${FASTAPI_WORKERS:-}' \
            docker compose --profile remote pull api ui; \
            REDIS_URL='$REDIS_URL' \
            OSS_JWT_SECRET='$OSS_JWT_SECRET' \
            IMAGE_TAG='$IMAGE_TAG' \
            REGISTRY='${REGISTRY:-}' \
            BACKEND_API_ENDPOINT='${BACKEND_API_ENDPOINT:-}' \
            BACKEND_URL='${BACKEND_URL:-}' \
            MINIO_PUBLIC_ENDPOINT='${MINIO_PUBLIC_ENDPOINT:-}' \
            TURN_HOST='${TURN_HOST:-}' \
            TURN_SECRET='${TURN_SECRET:-}' \
            FORCE_TURN_RELAY='${FORCE_TURN_RELAY:-}' \
            ENABLE_TELEMETRY='${ENABLE_TELEMETRY:-}' \
            FASTAPI_WORKERS='${FASTAPI_WORKERS:-}' \
            docker compose --profile remote up -d --remove-orphans; \
            docker compose --profile remote ps"

      - name: Smoke check API health
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail
          ssh "$EC2_USER@$EC2_HOST" "curl -fsS http://localhost:8000/api/v1/health > /dev/null"

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
